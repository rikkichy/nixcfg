# Nix Frost — native Linux-console theme.
# Fastfetch's nixos_old_small logo fits 80x24 without unsupported Unicode glyphs.
[display]
show_time = true
time_format = "%A  /  %d %B  /  %H:%M"
show_title = false
align_greeting = "center"
greeting = """
\u001b[96m  \\\\  \\\\ //  \u001b[0m
\u001b[96m ==\\\\__\\\\/ //\u001b[0m
\u001b[96m   //   \\\\// \u001b[0m
\u001b[94m==//     //==\u001b[0m
\u001b[94m //\\\\___//   \u001b[0m
\u001b[94m// /\\\\  \\\\==\u001b[0m
\u001b[94m  // \\\\  \\\\ \u001b[0m

\u001b[97mN I X O S\u001b[0m
\u001b[36mH Y P R L A N D   /   U W S M\u001b[0m
"""

[layout]
width = 44
container_padding = 1
prompt_padding = 1

[layout.widgets]
time_position = "top"
status_position = "hidden"

[theme]
container = "black"
border = "black"
text = "gray"
time = "cyan"
title = "lightblue"
greet = "lightblue"
prompt = "lightblue"
input = "white"
action = "cyan"
button = "lightblue"

[background]
kind = "doom"
fps = 15

[background.doom]
height = 3
spread = 2
top_color = "darkgray"
middle_color = "blue"
bottom_color = "lightblue"
