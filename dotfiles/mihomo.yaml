# Template for /run/mihomo/config.yaml. @SUBSCRIPTION_URL@ is spliced in at
# boot by the mihomo-config unit in configuration.nix, from
# /etc/mihomo/subscription.url -- the subscription link is a credential and this
# repo is public, so it is the one thing that cannot live here.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

# `device` is load-bearing: networking.firewall.trustedInterfaces and
# networking.networkmanager.unmanaged in configuration.nix name it too, and all
# three have to change together.
tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.internal"
  # Plain UDP to these is known to work on this connection -- it is what the
  # previous client resolved through. DoH is the usual advice but adds a
  # bootstrap dependency for no benefit here.
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  # Resolved directly, never through the tunnel -- this is what breaks the
  # chicken-and-egg of needing the proxy to reach the proxy.
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

# Pulls the node list from the subscription and refreshes it hourly, so nodes
# stay current without re-importing anything by hand.
#
# The header block is not optional. The panel (Remnawave) gates on device
# identity, and without `x-hwid` it answers 200 OK with a perfectly valid
# 1.4KB profile containing one node named "App not supported" pointed at
# 0.0.0.0:1 -- so mihomo starts happily, matches MATCH,PROXY, and every
# connection dies with "connect: connection refused". The internet appears to
# break rather than the subscription appearing to fail. With the header the
# same URL returns 46 real nodes. This is why FlClashX exists as a fork: it
# sends these headers and stock clients do not.
#
# User-Agent is a separate axis and is about *format*, not access: `clash.meta`
# gets Clash YAML, a generic UA gets base64 links. mihomo's default is already
# right; it is pinned here so the format cannot drift.
proxy-providers:
  subscription:
    type: http
    url: "@SUBSCRIPTION_URL@"
    interval: 3600
    path: ./providers/subscription.yaml
    # Fetch outside the tunnel. Without this mihomo dials the subscription
    # through its own TUN, where MATCH,PROXY sends it to the very nodes it is
    # trying to download -- so a failed update can never repair itself, and the
    # error surfaces as a bare `EOF` with nothing logged. It works exactly once,
    # on the first start, by racing the routing rules into place.
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "nix"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  # The one switch that matters, in the dashboard. DIRECT is the off position:
  # traffic still enters the TUN, mihomo just dials it out the physical
  # interface instead of a node, so there is nothing to stop and nothing to
  # start. AUTO is first so it is the default on a machine with no saved
  # selection yet (a fresh install).
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT
    use:
      - subscription

  # Leave PROXY on AUTO and let latency decide which node.
  - name: AUTO
    type: url-test
    use:
      - subscription
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

# Remember what PROXY is set to across restarts, in cache.db under the
# service's StateDirectory (/var/lib/private/mihomo). Without this every boot
# silently resets PROXY to its first member, so choosing DIRECT would last
# until the next reboot and the VPN would look like it re-enables itself.
profile:
  store-selected: true

rules:
  - MATCH,PROXY
