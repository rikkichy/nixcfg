# Template for /run/mihomo/config.yaml. The two subscription URLs are spliced in
# at boot by the mihomo-config unit in configuration.nix, from root-only files
# under /etc/mihomo. Subscription links are credentials and this repo is public,
# so their values cannot live here.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

# `device` is load-bearing: networking.firewall.trustedInterfaces and
# networking.networkmanager.unmanaged in configuration.nix name it too, and all
# three have to change together.
tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.internal"
  # Plain UDP to these is known to work on this connection -- it is what the
  # previous client resolved through. DoH is the usual advice but adds a
  # bootstrap dependency for no benefit here.
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  # Resolved directly, never through the tunnel -- this is what breaks the
  # chicken-and-egg of needing the proxy to reach the proxy.
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

# Each provider refreshes hourly and fetches outside the tunnel. A fetch routed
# through MATCH,PROXY would depend on the nodes it is trying to update, so one
# bad update could not repair itself and would surface only as a bare `EOF`.
#
# The primary panel (Remnawave) requires the device identity header. Without it
# the response is valid Clash YAML containing one "App not supported" node at
# 0.0.0.0:1, which makes the tunnel look healthy while all connections fail.
# `clash.meta` selects YAML rather than the base64 format from both panels.
proxy-providers:
  primary:
    type: http
    url: "@PRIMARY_SUBSCRIPTION_URL@"
    interval: 3600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "nix"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  quattro:
    type: http
    url: "@QUATTRO_SUBSCRIPTION_URL@"
    interval: 3600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "nix"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  # PROXY chooses a subscription or DIRECT. Each subscription group remembers
  # its own AUTO/manual node selection, so switching providers restores exactly
  # where that provider was left. DIRECT keeps the TUN and DNS hijack alive but
  # sends traffic out the physical interface.
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO
      - DIRECT

  - name: PRIMARY
    type: select
    proxies:
      - PRIMARY-AUTO
    use:
      - primary

  - name: PRIMARY-AUTO
    type: url-test
    use:
      - primary
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: QUATTRO
    type: select
    proxies:
      - QUATTRO-AUTO
    use:
      - quattro

  - name: QUATTRO-AUTO
    type: url-test
    use:
      - quattro
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

# Remember what PROXY is set to across restarts, in cache.db under the
# service's StateDirectory (/var/lib/private/mihomo). Without this every boot
# silently resets PROXY to its first member, so choosing DIRECT would last
# until the next reboot and the VPN would look like it re-enables itself.
profile:
  store-selected: true

rules:
  - MATCH,PROXY
