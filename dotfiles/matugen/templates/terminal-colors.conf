# Generated by matugen on every wallpaper change -- edits here are lost.
# The template is dotfiles/matugen/templates/terminal-colors.conf.
#
# foot carries no palette of its own; its colours arrive as OSC escape
# sequences pushed at it after every change. This file is the source those
# sequences are built from, kept as plain key=value rather than as literal
# escape bytes so it stays greppable and diffable in a text editor.
#
# The split here is deliberate and is the one thing to understand before
# editing it: **the greys track the wallpaper, the hues do not.**
#
# matugen's base16 output is a lightness ramp, not a set of semantic accents.
# base08 through base0f are ordered by brightness rather than by hue, so on a
# low-chroma wallpaper they collapse into near-blacks -- measured at
# #1d1e32 for "green" and #060a16 for "blue", which is invisible text.
# Feeding fixed ANSI colours through matugen's custom_colors does not fix it
# either: they are tone-mapped into the scheme whether or not blend is set,
# and yellow lands on #ffffff both ways.
#
# So slots 0, 7, 8 and 15 -- the greyscale ends that base16 genuinely does
# well -- come from the palette, and 1-6 and 9-14 are fixed. A wallpaper can
# still retint the terminal's background, text and cursor; it can no longer
# make red and green indistinguishable.
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
cursor={{colors.secondary.default.hex_stripped}}
selection={{colors.secondary.default.hex_stripped}}

# base00 is the canonical base16 choice for ANSI black and is wrong here: it
# renders two shades off the background, so anything drawn in black vanishes.
# base02 upward is the visible part of the ramp.
color0={{base16.base02.default.hex_stripped}}
color1=ff6b6b
color2=a3e635
color3=fbbf24
color4=7aa2f7
color5=c78bff
color6=56cfe1
color7={{base16.base06.default.hex_stripped}}

color8={{base16.base04.default.hex_stripped}}
color9=ff8787
color10=bef264
color11=fcd34d
color12=9db4f9
color13=d8a5ff
color14=7ae0ee
color15={{base16.base07.default.hex_stripped}}

# 16-18 are outside the ANSI range and carry the accent trio, so a TUI that
# reaches past colour 15 lands on the scheme rather than on the xterm cube.
color16={{colors.primary.default.hex_stripped}}
color17={{colors.secondary.default.hex_stripped}}
color18={{colors.tertiary.default.hex_stripped}}
