# Generated by matugen on every wallpaper change -- edits here are lost.
# The template is dotfiles/matugen/templates/cursor.conf.
#
# One colour, because the cursor's three are derived from it rather than
# picked: bibata-tonal.py fixes a lightness per role and caps the chroma, so
# what the palette has to supply is a hue. The reasoning is in that file.
#
# primary is the accent every other surface here is keyed to -- it is what
# hypr/variables.lua paints an active window border with -- so the cursor
# outline and the border around the window under it come out the same colour.
#
# Deriving the three in a template instead is not available. matugen's
# set_lightness works in HSL, where a near-white colour carries a high
# saturation: #fffbff at lightness 20 is #660066, so a pale wallpaper would
# produce a vividly purple cursor rather than the grey one it asks for.
accent={{colors.primary.default.hex}}
