<!--
  Generated by matugen on every wallpaper change; edits here are lost.
  The template is dotfiles/matugen/templates/halrune.svg.

  The launcher icon for Halrune Commander, and the one icon on this machine
  that does not come from an icon theme: it is rendered from the palette with
  everything else, so the entry that opens the desktop's own tools carries the
  desktop's own colour.

  Nothing in this file may contain a doubled hyphen. XML forbids one inside a
  comment, which makes the whole document invalid, and an invalid icon is not
  reported anywhere: fuzzel draws a blank row, which is exactly what a name
  that resolved to nothing looks like. That is why the prose here writes its
  dashes as em dashes where the rest of the repo uses a doubled hyphen.

  The glyph is hagalaz, two staves and a slanting bar, which is also a plain
  H, so the icon reads as the name whether or not the rune is recognised.

  primary against on_primary rather than a surface pair, because the tile has
  to hold its own between Papirus's saturated icons above and below it. Those
  two are a contrasting pair in every scheme matugen emits, so the glyph stays
  legible whatever the wallpaper does; a low-chroma wallpaper yields a pale
  tile rather than an unreadable one.

  The geometry is a 64 unit box and scales with the row: fuzzel draws an icon
  at the row height, 40px in the launcher, and the 5.5 stroke is what keeps
  the slanting bar visible at the small end.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="3" y="3" width="58" height="58" rx="17"
        fill="{{colors.primary.default.hex}}"/>
  <g fill="none" stroke="{{colors.on_primary.default.hex}}"
     stroke-width="5.5" stroke-linecap="round">
    <path d="M21 15V49"/>
    <path d="M43 15V49"/>
    <path d="M21 25.5L43 38.5"/>
  </g>
</svg>
