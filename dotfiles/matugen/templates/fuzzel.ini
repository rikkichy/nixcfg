# Generated by matugen on every wallpaper change -- edits here are lost.
# The template is dotfiles/matugen/templates/fuzzel.ini.
#
# font, lines and width are overridden by flag at every call site (the launcher
# in hypr/hyprland/keybinds.lua, and wpp/awpp/vpnp/powermenu), because this file
# is regenerated and cannot be tracked. What is set here is what a bare `fuzzel`
# falls back to, and `lines` is load-bearing for the launcher, which grows its
# window from this number rather than passing its own.
font=Google Sans Flex Rounded:size=17
# icon-theme names a theme's *folder*, case sensitively, and defaults to
# `default` -- a compatibility theme that is not installed here, so the lookup
# falls through to hicolor, which holds only what an application shipped for
# itself. Every name the entries in home.nix use (preferences-desktop-wallpaper,
# applications-multimedia, system-shutdown, network-vpn, bitwarden, spotify)
# lives in Papirus and nowhere else, as do the ones the pickers pass through
# the dmenu protocol. Papirus-Dark is the set dconf gives GTK.
icon-theme=Papirus-Dark
terminal=foot -e
prompt="> "
layer=overlay
lines=15
width=60
dpi-aware=no
inner-pad=10
horizontal-pad=40
vertical-pad=15
match-counter=yes

[colors]
background={{colors.surface.default.hex_stripped}}ff
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.primary.default.hex_stripped}}ff
placeholder={{colors.outline.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.tertiary.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}87
selection-text={{colors.on_surface.default.hex_stripped}}ff
selection-match={{colors.tertiary.default.hex_stripped}}ff
counter={{colors.outline.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}77

[border]
radius=22
width=3
