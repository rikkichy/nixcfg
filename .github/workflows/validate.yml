name: Validate configuration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            require-sigs = true
      - name: Select comparison and native parser
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE=$(git hash-object -w -t tree --stdin < /dev/null)
          fi
          echo "VALIDATION_BASE=$BASE" >> "$GITHUB_ENV"
          if ! git diff --quiet "$BASE" -- hosts/nix/dotfiles/ricing/hypr/; then
            nix build --no-write-lock-file --out-link "$RUNNER_TEMP/hyprland" 'path:.#hyprland'
            echo "$RUNNER_TEMP/hyprland/bin" >> "$GITHUB_PATH"
          fi
      - name: Validate all host configurations
        run: bash .omp/skills/nixcfg-validation/scripts/check.sh full all "$VALIDATION_BASE"
