
mixed-port: 7890
allow-lan: false
mode: rule
find-process-mode: "off"
tcp-concurrent: true
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ${token}
external-controller-cors:
  allow-origins:
    - http://127.0.0.1:9090
  allow-private-network: false

tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack: []

dns:
  enable: false

proxy-providers:
  primary:
    type: http
    url: ${primary}
    interval: 600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

  quattro:
    type: http
    url: ${quattro}
    interval: 600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO

  - name: PRIMARY
    type: select
    empty-fallback: REJECT
    use:
      - primary

  - name: QUATTRO
    type: select
    empty-fallback: REJECT
    use:
      - quattro

profile:
  store-selected: true

rule-providers:
  refilter-ips:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/ipsum.lst
    path: ./rules/refilter-ips.txt
    interval: 21600
    proxy: DIRECT

rules:
  # Keep loopback and private LAN destinations out of the upstream proxy.
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # Reject listed UDP if the selected node cannot relay it.
  - RULE-SET,refilter-ips,PROXY
  - RULE-SET,refilter-ips,REJECT

  - MATCH,DIRECT
