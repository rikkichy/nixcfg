
mixed-port: 7890
allow-lan: false
mode: rule
find-process-mode: strict
tcp-concurrent: true
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ${token}
external-controller-cors:
  allow-origins:
    - http://127.0.0.1:9090
  allow-private-network: false

geo-auto-update: true
geo-update-interval: 24

geox-url:
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack: []

dns:
  enable: false

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 2053, 2083, 2087, 2096, 8443]
    QUIC:
      ports: [443, 8443]

proxy-providers:
  primary:
    type: http
    url: ${primary}
    interval: 600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

  quattro:
    type: http
    url: ${quattro}
    interval: 600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO

  - name: PRIMARY
    type: select
    empty-fallback: REJECT
    use:
      - primary

  - name: QUATTRO
    type: select
    empty-fallback: REJECT
    use:
      - quattro

profile:
  store-selected: true

rules:
  # Keep loopback and private LAN destinations out of the upstream proxy.
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # If the selected node cannot relay a matching flow (notably UDP),
  # reject it instead of continuing to the default DIRECT rule.
  # The native Nix-packaged Discord executable owns voice UDP sockets.
  - PROCESS-NAME,.Discord-wrapped,PROXY
  - PROCESS-NAME,.Discord-wrapped,REJECT
  - GEOSITE,youtube,PROXY
  - GEOSITE,youtube,REJECT
  - GEOSITE,discord,PROXY
  - GEOSITE,discord,REJECT
  - GEOSITE,roblox,PROXY
  - GEOSITE,roblox,REJECT
  - GEOSITE,instagram,PROXY
  - GEOSITE,instagram,REJECT
  - GEOSITE,protonmail,PROXY
  - GEOSITE,protonmail,REJECT
  - GEOSITE,spotify,PROXY
  - GEOSITE,spotify,REJECT
  - GEOSITE,bitwarden,PROXY
  - GEOSITE,bitwarden,REJECT
  - GEOSITE,pinterest,PROXY
  - GEOSITE,pinterest,REJECT
  - DOMAIN-SUFFIX,patreon.com,PROXY
  - DOMAIN-SUFFIX,patreon.com,REJECT
  - DOMAIN-SUFFIX,patreonusercontent.com,PROXY
  - DOMAIN-SUFFIX,patreonusercontent.com,REJECT
  - DOMAIN-SUFFIX,cachix.org,PROXY
  - DOMAIN-SUFFIX,cachix.org,REJECT
  - DOMAIN-SUFFIX,noko.chat,PROXY
  - DOMAIN-SUFFIX,noko.chat,REJECT
  - DOMAIN-SUFFIX,anime-365.ru,PROXY
  - DOMAIN-SUFFIX,anime-365.ru,REJECT
  - DOMAIN-SUFFIX,6b6t.org,PROXY
  - DOMAIN-SUFFIX,6b6t.org,REJECT
  - DOMAIN-SUFFIX,enderdash.com,PROXY
  - DOMAIN-SUFFIX,enderdash.com,REJECT
  - DOMAIN-SUFFIX,cyrisia.com,PROXY
  - DOMAIN-SUFFIX,cyrisia.com,REJECT

  # ponytail: current DNS IPs; refresh after endpoint changes, DNS mapping if frequent.
  # mc.hypixel.net and 6b6t.org's SRV target alt.6b6t.org.
  - AND,((DST-PORT,25565),(IP-CIDR,172.65.197.160/32,no-resolve)),PROXY
  - AND,((DST-PORT,25565),(IP-CIDR,172.65.197.160/32,no-resolve)),REJECT
  - AND,((DST-PORT,25565),(IP-CIDR,15.204.129.101/32,no-resolve)),PROXY
  - AND,((DST-PORT,25565),(IP-CIDR,15.204.129.101/32,no-resolve)),REJECT

  - IP-ASN,22697,PROXY,no-resolve
  - IP-ASN,22697,REJECT,no-resolve

  - MATCH,DIRECT
