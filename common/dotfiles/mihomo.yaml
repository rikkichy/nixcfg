
mixed-port: 7890
allow-lan: false
mode: rule
find-process-mode: off
tcp-concurrent: true
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ${token}
external-controller-cors:
  allow-origins:
    - http://127.0.0.1:9090
  allow-private-network: false

tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack: []

dns:
  enable: false

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports: [443]
    QUIC:
      ports: [443]

proxy-providers:
  primary:
    type: http
    url: ${primary}
    interval: 600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

  quattro:
    type: http
    url: ${quattro}
    interval: 600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO

  - name: PRIMARY
    type: select
    empty-fallback: REJECT
    use:
      - primary

  - name: QUATTRO
    type: select
    empty-fallback: REJECT
    use:
      - quattro

profile:
  store-selected: true

rules:
  - DOMAIN-SUFFIX,anthropic.com,PROXY
  - DOMAIN-SUFFIX,anthropic.com,REJECT
  - DOMAIN-SUFFIX,claude.ai,PROXY
  - DOMAIN-SUFFIX,claude.ai,REJECT
  - DOMAIN-SUFFIX,chatgpt.com,PROXY
  - DOMAIN-SUFFIX,chatgpt.com,REJECT
  - MATCH,DIRECT
