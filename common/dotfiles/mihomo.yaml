
mixed-port: 7890
allow-lan: false
mode: rule
find-process-mode: off
tcp-concurrent: true
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ${token}
external-controller-cors:
  allow-origins:
    - http://127.0.0.1:9090
  allow-private-network: false

tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack: []

dns:
  enable: false

proxy-providers:
  primary:
    type: http
    url: ${primary}
    interval: 600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

  quattro:
    type: http
    url: ${quattro}
    interval: 600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - ${hwid}
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - ${hostname}
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO

  - name: PRIMARY
    type: select
    empty-fallback: REJECT
    use:
      - primary

  - name: QUATTRO
    type: select
    empty-fallback: REJECT
    use:
      - quattro

profile:
  store-selected: true

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - AND,((NETWORK,udp),(IP-CIDR,224.0.0.251/32,no-resolve),(DST-PORT,5353)),DIRECT
  - AND,((NETWORK,udp),(IP-CIDR,239.255.255.250/32,no-resolve),(DST-PORT,1900)),DIRECT
  - MATCH,PROXY
  - MATCH,REJECT
