
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

geox-url:
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb

tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack: []

dns:
  enable: false

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 2053, 2083, 2087, 2096, 8443]
    QUIC:
      ports: [443, 8443]

proxy-providers:
  primary:
    type: http
    url: "@PRIMARY_SUBSCRIPTION_URL@"
    interval: 600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "@HOSTNAME@"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  quattro:
    type: http
    url: "@QUATTRO_SUBSCRIPTION_URL@"
    interval: 600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "@HOSTNAME@"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO

  - name: PRIMARY
    type: select
    use:
      - primary

  - name: QUATTRO
    type: select
    use:
      - quattro

profile:
  store-selected: true

rules:
  # Keep loopback and private LAN destinations out of the upstream proxy.
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  - GEOSITE,youtube,PROXY
  - GEOSITE,discord,PROXY
  - GEOSITE,roblox,PROXY
  - GEOSITE,instagram,PROXY
  - GEOSITE,protonmail,PROXY
  - IP-ASN,22697,PROXY,no-resolve

  # Discord media uses IP-addressed UDP. These are observed assignments,
  # not an exhaustive list; keep process inspection sandboxed.
  - IP-CIDR,104.29.159.128/32,PROXY,no-resolve
  - IP-CIDR,104.29.148.61/32,PROXY,no-resolve
  - IP-CIDR,104.29.136.193/32,PROXY,no-resolve
  - IP-CIDR,104.29.146.68/32,PROXY,no-resolve
  - IP-CIDR,104.29.153.100/32,PROXY,no-resolve
  - IP-CIDR,104.29.153.203/32,PROXY,no-resolve
  - IP-CIDR,35.217.31.203/32,PROXY,no-resolve

  - MATCH,DIRECT
