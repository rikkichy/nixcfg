
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

tun:
  enable: true
  device: mihomo
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.internal"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

proxy-providers:
  primary:
    type: http
    url: "@PRIMARY_SUBSCRIPTION_URL@"
    interval: 3600
    path: ./providers/primary.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "@HOSTNAME@"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  quattro:
    type: http
    url: "@QUATTRO_SUBSCRIPTION_URL@"
    interval: 3600
    path: ./providers/quattro.yaml
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta/v1.19.29"
      x-hwid:
        - "@HWID@"
      x-device-os:
        - "Linux"
      x-ver-os:
        - "NixOS"
      x-device-model:
        - "@HOSTNAME@"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - PRIMARY
      - QUATTRO
      - DIRECT

  - name: PRIMARY
    type: select
    proxies:
      - PRIMARY-AUTO
    use:
      - primary

  - name: PRIMARY-AUTO
    type: url-test
    use:
      - primary
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: QUATTRO
    type: select
    proxies:
      - QUATTRO-AUTO
    use:
      - quattro

  - name: QUATTRO-AUTO
    type: url-test
    use:
      - quattro
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

profile:
  store-selected: true

rules:
  - MATCH,PROXY
